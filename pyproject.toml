[project]
name = "cluoduo"
version = "0.1.0"
description = "Cluo Duo: a co-operative word game with an AI partner"
readme = "README.md"
authors = [
    { name = "Ryan Ward", email = "wardyryan1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "modal>=1.6.2",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]
